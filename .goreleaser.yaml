version: 2

project_name: csi-driver-zerofs

release:
  prerelease: auto
  extra_files:
    - glob: .goreleaser-extra/manifests/*.yaml

before:
  hooks:
    - rm -rf .goreleaser-extra/manifests
    - make render-manifests VERSION=v{{ .Version }} MANIFEST_OUTPUT_DIR=.goreleaser-extra/manifests

changelog:
  disable: true

builds:
  - id: csi-driver-zerofs
    main: ./cmd/csi-driver-zerofs
    binary: csi-driver-zerofs
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -extldflags "-static"

dockers_v2:
  - ids:
      - csi-driver-zerofs
    dockerfile: Dockerfile.goreleaser
    images:
      - ghcr.io/{{ .Env.GITHUB_REPOSITORY }}
    tags:
      - "v{{ .Version }}"
      - latest
    labels:
      org.opencontainers.image.created: "{{ .Date }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.version: "v{{ .Version }}"
      org.opencontainers.image.source: https://github.com/{{ .Env.GITHUB_REPOSITORY }}
    platforms:
      - linux/amd64
      - linux/arm64
    flags:
      - --pull
